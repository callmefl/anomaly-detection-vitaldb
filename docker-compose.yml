services:

  # === MongoDB 8.0 (Time Series Collections) ===
  mongo:
    image: mongo:8.0
    container_name: vitaldb_mongo
    restart: always
    command: --replSet rs0
    ports:
      - "27017:27017"
    volumes:
        - mongo_data:/data/db
        - ./mongo:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: >
        echo "
          try {
            var status = rs.status();
            var self = status.members.find(m => m.self);
            if (!self || self.stateStr === 'UNKNOWN' || self.stateStr === 'REMOVED') {
              var cfg = rs.conf();
              cfg.members[0].host = 'mongo:27017';
              rs.reconfig(cfg, { force: true });
            }
          } catch(err) {
            rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] });
          }
        " | mongosh --quiet
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 30s
    networks:
      - vitaldb_net

  # === Backend API (FastAPI + Python 3.12) ===
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vitaldb_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/?directConnection=true
      - DB_NAME=vitaldb_project
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./api:/app/api
      - ./dashboard:/app/dashboard
      - ./tests:/app/tests
      - ./relazione:/app/relazione
      - ./scripts:/app/scripts
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - vitaldb_net

networks:
  vitaldb_net:
    driver: bridge

volumes:
  mongo_data:
