services:

  # === MongoDB 8.0 (Time Series Collections) ===
  mongo:
    image: mongo:8.0
    container_name: vitaldb_mongo
    restart: always
    command: --replSet rs0
    ports:
      - "27017:27017"
    volumes:
        - mongo_data:/data/db
        - ./mongo:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate() }" | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vitaldb_net

  # === Backend API (FastAPI + Python 3.12) ===
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vitaldb_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/?directConnection=true
      - DB_NAME=vitaldb_project
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./api:/app/api
      - ./dashboard:/app/dashboard
      - ./tests:/app/tests
      - ./relazione:/app/relazione
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - vitaldb_net

networks:
  vitaldb_net:
    driver: bridge

volumes:
  mongo_data:
