<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <defs>
    <style>
      .main-title { font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 17px; font-weight: 700; fill: #0F172A; }
      .main-subtitle { font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; fill: #64748B; }
      .phase-num { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }
      .card-title { font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: 700; }
      .card-desc { font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; fill: #334155; line-height: 1.4; }
      .card-tech { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10.5px; font-weight: 600; fill: #64748B; }
      .edge-label { font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #475569; }
      .badge-text { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 10px; font-weight: 700; }
    </style>

    <!-- Marker per frecce -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0047FF"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4F46E5"/>
    </marker>
  </defs>

  <!-- SFONDO TELA FIGMA / DOCUMENTO BIANCO CON BORDO SOTTILE -->
  <rect width="1200" height="560" fill="#FFFFFF" rx="14" stroke="#CBD5E1" stroke-width="1.2"/>

  <!-- ======================================================== -->
  <!-- HEADER DELLA FIGURA (Titolo e Didascalia per la Relazione) -->
  <!-- ======================================================== -->
  <g id="Header">
    <rect x="40" y="24" width="8" height="34" rx="4" fill="#0047FF"/>
    <text x="58" y="42" class="main-title">ARCHITETTURA GENERALE: FLUSSO DEI DATI E RILEVAMENTO DELLE ANOMALIE</text>
    <text x="58" y="61" class="main-subtitle">Dalla raccolta dei segnali fisiologici VitalDB (1 Hz) alla bonifica a tre livelli e all'inferenza con intelligenza artificiale</text>
  </g>

  <!-- ======================================================== -->
  <!-- RIGA 1: RACCOLTA, LAKEHOUSE MEDALLION E STORAGE         -->
  <!-- ======================================================== -->

  <!-- BLOCCO 0: SORGENTE ESTERNA VITALDB -->
  <g id="Sorgente" transform="translate(40, 95)">
    <rect width="170" height="180" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="12" y="12" width="70" height="20" rx="4" fill="#E2E8F0"/>
    <text x="47" y="26" text-anchor="middle" class="badge-text" fill="#475569">SORGENTE</text>

    <text x="14" y="60" class="card-title" fill="#0F172A">VitalDB Clinico</text>
    <text x="14" y="85" class="card-desc">Segnali operatori da monitor</text>
    <text x="14" y="103" class="card-desc">pazienti e sensori ECG,</text>
    <text x="14" y="121" class="card-desc">SpO2 e bracciale NIBP.</text>

    <rect x="12" y="142" width="146" height="24" rx="4" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="85" y="158" text-anchor="middle" class="card-tech">500 casi · 1 Hz</text>
  </g>

  <!-- FRECCIA 0 -> 1 -->
  <path d="M 210,185 L 250,185" fill="none" stroke="#64748B" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- BLOCCO 1: BRONZE LAYER -->
  <g id="BronzeLayer" transform="translate(255, 95)">
    <rect width="210" height="180" rx="10" fill="#FFF5F5" stroke="#FF6B6B" stroke-width="1.5"/>
    <rect x="12" y="12" width="95" height="20" rx="4" fill="#FFE4E4"/>
    <text x="59.5" y="26" text-anchor="middle" class="badge-text" fill="#D94646">1. BRONZE LAYER</text>

    <text x="14" y="60" class="card-title" fill="#D94646">Dati Grezzi Intatti</text>
    <text x="14" y="85" class="card-desc">Download e memorizzazione</text>
    <text x="14" y="103" class="card-desc">senza modifiche: garantisce</text>
    <text x="14" y="121" class="card-desc">la totale tracciabilità storica.</text>

    <rect x="12" y="142" width="186" height="24" rx="4" fill="#FFFFFF" stroke="#FECACA"/>
    <text x="105" y="158" text-anchor="middle" class="card-tech" fill="#991B1B">case_ID.parquet (34 MB)</text>
  </g>

  <!-- FRECCIA 1 -> 2 -->
  <path d="M 465,185 L 505,185" fill="none" stroke="#0047FF" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

  <!-- BLOCCO 2: SILVER LAYER -->
  <g id="SilverLayer" transform="translate(510, 95)">
    <rect width="220" height="180" rx="10" fill="#F0F5FF" stroke="#0047FF" stroke-width="1.5"/>
    <rect x="12" y="12" width="90" height="20" rx="4" fill="#DBEAFE"/>
    <text x="57" y="26" text-anchor="middle" class="badge-text" fill="#0047FF">2. SILVER LAYER</text>

    <text x="14" y="60" class="card-title" fill="#0047FF">Bonifica Clinica</text>
    <text x="14" y="85" class="card-desc">Rimozione errori e sfarfallii,</text>
    <text x="14" y="103" class="card-desc">propagazione pause bracciale</text>
    <text x="14" y="121" class="card-desc">e partizionamento per reparto.</text>

    <rect x="12" y="142" width="196" height="24" rx="4" fill="#FFFFFF" stroke="#BFDBFE"/>
    <text x="110" y="158" text-anchor="middle" class="card-tech" fill="#1D4ED8">department=DEP/ (45 MB)</text>
  </g>

  <!-- FRECCIA 2 -> 3 -->
  <path d="M 730,185 L 770,185" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow-teal)"/>

  <!-- BLOCCO 3: GOLD LAYER -->
  <g id="GoldLayer" transform="translate(775, 95)">
    <rect width="215" height="180" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
    <rect x="12" y="12" width="80" height="20" rx="4" fill="#DCFCE7"/>
    <text x="52" y="26" text-anchor="middle" class="badge-text" fill="#059669">3. GOLD LAYER</text>

    <text x="14" y="60" class="card-title" fill="#059669">Archivio Time Series</text>
    <text x="14" y="85" class="card-desc">Caricamento protetto a due fasi</text>
    <text x="14" y="103" class="card-desc">su MongoDB: indicizzazione e</text>
    <text x="14" y="121" class="card-desc">compressione -65% su disco.</text>

    <rect x="12" y="142" width="191" height="24" rx="4" fill="#FFFFFF" stroke="#BBF7D0"/>
    <text x="107.5" y="158" text-anchor="middle" class="card-tech" fill="#15803D">MongoDB 8.0 TS (15,6 MB)</text>
  </g>

  <!-- FRECCIA RIGA 1 -> RIGA 2 (Curva di transizione da Gold verso Motore AI) -->
  <path d="M 990,185 L 1050,185 Q 1070,185 1070,230 L 1070,335 Q 1070,380 1020,380 L 980,380" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#arrow-indigo)"/>
  <text x="1080" y="285" class="edge-label" fill="#4F46E5" transform="rotate(90, 1080, 285)" text-anchor="middle">Serie pronte per l'AI</text>

  <!-- ======================================================== -->
  <!-- RIGA 2: INTELLIGENZA ARTIFICIALE E APPLICAZIONE FINALE   -->
  <!-- ======================================================== -->

  <!-- BLOCCO 4: MOTORE AI ANOMALIE (4 MODELLI) -->
  <g id="MotoreAI" transform="translate(425, 305)">
    <rect width="550" height="215" rx="10" fill="#F8FAFC" stroke="#6366F1" stroke-width="1.6"/>
    
    <rect x="16" y="14" width="165" height="22" rx="4" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text x="98.5" y="29" text-anchor="middle" class="badge-text" fill="#4F46E5">4. MOTORE ANOMALY DETECTION</text>
    <text x="210" y="30" class="card-title" fill="#1E1B4B">Ensemble Ibrido con Voto di Consenso</text>

    <!-- Mini-card 4 Algoritmi distribuiti in griglia 2x2 pulita -->
    <!-- Algoritmo 1: Isolation Forest -->
    <rect x="16" y="48" width="250" height="68" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="26" y="68" font-size="12px" font-weight="700" fill="#0F172A">Isolation Forest</text>
    <text x="26" y="85" font-size="10.5px" fill="#475569">Isola rapidamente valori estremi</text>
    <text x="26" y="100" font-size="10.5px" fill="#64748B">tramite partizioni casuali ad albero</text>

    <!-- Algoritmo 2: Local Outlier Factor (LOF) -->
    <rect x="280" y="48" width="250" height="68" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="290" y="68" font-size="12px" font-weight="700" fill="#0F172A">Local Outlier Factor (LOF)</text>
    <text x="290" y="85" font-size="10.5px" fill="#475569">Confronta la densità locale rispetto</text>
    <text x="290" y="100" font-size="10.5px" fill="#64748B">ai vicini (rileva cluster anomali)</text>

    <!-- Algoritmo 3: LSTM Autoencoder -->
    <rect x="16" y="128" width="250" height="70" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="26" y="148" font-size="12px" font-weight="700" fill="#4F46E5">LSTM Autoencoder (Deep Learning)</text>
    <text x="26" y="165" font-size="10.5px" fill="#475569">Rete ricorrente neurale: modella le</text>
    <text x="26" y="180" font-size="10.5px" fill="#64748B">dipendenze temporali battito/pressione</text>

    <!-- Algoritmo 4: Distanza di Mahalanobis Robusta -->
    <rect x="280" y="128" width="250" height="70" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="290" y="148" font-size="12px" font-weight="700" fill="#0F172A">Distanza Robusta di Mahalanobis</text>
    <text x="290" y="165" font-size="10.5px" fill="#475569">Misura multivariata statistica con</text>
    <text x="290" y="180" font-size="10.5px" fill="#64748B">matrice di covarianza MinCovDet</text>
  </g>

  <!-- FRECCIA MOTORE AI -> APPLICAZIONE -->
  <path d="M 425,410 L 375,410" fill="none" stroke="#D97706" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- BLOCCO 5: APPLICAZIONE E DASHBOARD CONSULTAZIONE -->
  <g id="Applicazione" transform="translate(40, 305)">
    <rect width="325" height="215" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="16" y="14" width="115" height="22" rx="4" fill="#FEF3C7"/>
    <text x="73.5" y="29" text-anchor="middle" class="badge-text" fill="#B45309">5. CONSULTAZIONE</text>

    <text x="16" y="62" class="card-title" fill="#B45309">Pannello Medico &amp; API</text>
    <text x="16" y="88" class="card-desc">Esposizione dei risultati tramite API REST</text>
    <text x="16" y="106" class="card-desc">e visualizzazione interattiva dei tracciati,</text>
    <text x="16" y="124" class="card-desc">degli allarmi e del livello di confidenza.</text>

    <rect x="16" y="150" width="293" height="48" rx="6" fill="#FFFFFF" stroke="#FDE68A"/>
    <text x="28" y="170" font-size="11.5px" font-weight="700" fill="#92400E">FastAPI :8000 &amp; Streamlit Dashboard</text>
    <text x="28" y="187" class="card-tech" fill="#B45309">Grafici interattivi · Report allarmi</text>
  </g>

</svg>