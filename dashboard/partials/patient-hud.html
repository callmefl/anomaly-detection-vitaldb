<!-- PATIENT HUD — Identity Banner + Actions -->
<div class="patient-hud-banner">
  <div class="patient-identity">
    <div class="patient-avatar-box">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></svg>
    </div>
    <div class="patient-meta-block">
      <div class="patient-name-row">
        <h2 class="patient-heading" id="hudPatientTitle">Paziente Intraoperatorio #—</h2>
      </div>
      <div class="patient-specs-row">
        <div class="patient-spec-item">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></svg>
          <span id="hudPatientDept">Chirurgia Generale</span>
        </div>
        <span>•</span>
        <div class="patient-spec-item">
          <span id="hudPatientAgeSex">Età N/D • Sesso N/D</span>
        </div>
      </div>
    </div>
  </div>

  <!-- HUD Actions -->
  <div class="hud-actions">
    <select class="custom-select-control" id="windowSelect" onchange="app.onWindowChange(this.value)">
      <option value="">Risoluzione 1s (Dato Integrale)</option>
      <option value="30">Aggregazione 30s</option>
      <option value="60" selected>Aggregazione 60s (Ottimale)</option>
      <option value="300">Aggregazione 5m</option>
    </select>
    
    <button class="btn-action btn-secondary-action" onclick="app.loadSeries(store.getState().currentCaseId, store.getState().downsampleWindow)">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      <span>Ricarica</span>
    </button>
    
    <button class="btn-action btn-primary-action" id="btnRunDetection" onclick="app.runDetection()">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
      <span>Rileva Anomalie</span>
    </button>
  </div>
</div>
