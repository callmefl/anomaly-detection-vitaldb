<!-- ANOMALY TABLE — Clinical Event Inspector -->
<div class="table-section-card hidden" id="anomalyTableWrapper">
  <div class="table-toolbar-header">
    <div class="table-title-block">
      <h3>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        <span>Registro Clinico degli Eventi Anomali</span>
      </h3>
      <p id="anomalyTableSubtitle">Visualizzazione eventi anomali filtrati</p>
    </div>

    <div class="table-actions-group">
      <select class="custom-select-control" id="tableFilterSelect" onchange="app.onTableFilterChange(this.value)">
        <option value="all">Tutte le Anomalie</option>
        <option value="high_severity">Alta Confidenza (3+ Algoritmi)</option>
        <option value="shock_index">Shock Index Clinico</option>
        <option value="severe_hypotension">Ipotensione Severa</option>
        <option value="isolation_forest">Isolation Forest</option>
        <option value="autoencoder">Autoencoder Neurale</option>
      </select>

      <select class="custom-select-control" id="tableLimitSelect" onchange="app.onTableLimitChange(this.value)">
        <option value="all" selected>Tutti gli Eventi</option>
        <option value="50">Primi 50 Eventi</option>
        <option value="100">Primi 100 Eventi</option>
        <option value="250">Primi 250 Eventi</option>
      </select>

      <button class="btn-action btn-secondary-action" onclick="app.exportCSV()">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        <span>Esporta CSV</span>
      </button>
    </div>
  </div>

  <div class="table-container-scroll">
    <table class="telemetry-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Timestamp (UTC)</th>
          <th>Livello Severità</th>
          <th>HR (bpm)</th>
          <th>SpO₂ (%)</th>
          <th>NIBP (SBP/DBP)</th>
          <th>Shock Index</th>
          <th>Algoritmi Rilevatori</th>
        </tr>
      </thead>
      <tbody id="anomalyTableBody"></tbody>
    </table>
  </div>
</div>
