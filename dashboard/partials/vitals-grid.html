<!-- VITALS GRID — 5 KPI Cards -->
<div class="bento-vitals-grid">
  
  <!-- Card 1: Heart Rate -->
  <div class="vital-card">
    <div class="vital-card-spark-indicator" style="background: var(--telemetry-heart);"></div>
    <div class="vital-card-top">
      <div class="vital-card-label" style="color: var(--telemetry-heart);">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></svg>
        <span>Frequenza Cardiaca</span>
      </div>
    </div>
    <div class="vital-card-value-row">
      <span class="vital-metric-large" id="vitalHR" style="color: var(--telemetry-heart);">—</span>
      <span class="vital-metric-unit">bpm</span>
    </div>
    <div class="vital-bounds-tag" id="vitalHRRange">Range Fisiologico: 60 – 100 bpm</div>
  </div>

  <!-- Card 2: SpO2 -->
  <div class="vital-card">
    <div class="vital-card-spark-indicator" style="background: var(--telemetry-cyan);"></div>
    <div class="vital-card-top">
      <div class="vital-card-label" style="color: var(--telemetry-cyan);">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>
        <span>Saturazione SpO₂</span>
      </div>
    </div>
    <div class="vital-card-value-row">
      <span class="vital-metric-large" id="vitalSpO2" style="color: var(--telemetry-cyan);">—</span>
      <span class="vital-metric-unit">%</span>
    </div>
    <div class="vital-bounds-tag" id="vitalSpO2Min">Target Eupnoico: 95 – 100 %</div>
  </div>

  <!-- Card 3: Blood Pressure -->
  <div class="vital-card">
    <div class="vital-card-spark-indicator" style="background: var(--telemetry-amber);"></div>
    <div class="vital-card-top">
      <div class="vital-card-label" style="color: var(--telemetry-amber);">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></svg>
        <span>Pressione (SBP/DBP)</span>
      </div>
    </div>
    <div class="vital-card-value-row">
      <span class="vital-metric-large" id="vitalNIBP" style="color: var(--telemetry-amber);">—/—</span>
      <span class="vital-metric-unit">mmHg</span>
    </div>
    <div class="vital-bounds-tag" id="vitalMBP">MAP Media Fisiologica: > 65 mmHg</div>
  </div>

  <!-- Card 4: Shock Index -->
  <div class="vital-card">
    <div class="vital-card-spark-indicator" style="background: var(--telemetry-shock);"></div>
    <div class="vital-card-top">
      <div class="vital-card-label" style="color: var(--telemetry-shock);">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>
        <span>Shock Index (HR/SBP)</span>
      </div>
    </div>
    <div class="vital-card-value-row">
      <span class="vital-metric-large" id="vitalShockIndex" style="color: var(--telemetry-shock);">—</span>
      <span class="vital-metric-unit">ratio</span>
    </div>
    <div class="vital-bounds-tag" id="vitalSIStatus">Stabilità: &lt; 0.7 | Shock: &gt; 0.9</div>
  </div>

  <!-- Card 5: Total Anomalies -->
  <div class="vital-card">
    <div class="vital-card-spark-indicator" style="background: var(--telemetry-consensus);"></div>
    <div class="vital-card-top">
      <div class="vital-card-label" style="color: var(--telemetry-consensus);">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
        <span>Anomalie Totali Uniche</span>
      </div>
    </div>
    <div class="vital-card-value-row">
      <span class="vital-metric-large" id="vitalAnomaliesCount" style="color: var(--telemetry-consensus);">—</span>
      <span class="vital-metric-unit">eventi</span>
    </div>
    <div class="vital-bounds-tag" id="vitalAnomaliesStatus">Premi "Rileva Anomalie"</div>
  </div>

</div>
