<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>VitalDB — Clinical Telemetry & Lakehouse Anomaly Suite</title>
  
  <!-- Typefaces: Figtree (Display), Space Grotesk (Body/UI), JetBrains Mono (Readouts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <!-- Chart.js 4 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <!-- Design System v3.2 -->
  <link rel="stylesheet" href="css/style.css?v=3.2" />
</head>
<body>

  <!-- 1. HEADER (loaded from partial) -->
  <div data-include="partials/header.html"></div>

  <!-- 2. SPLIT WORKBENCH LAYOUT -->
  <div class="workbench-layout">
    
    <!-- SIDEBAR RAIL -->
    <div data-include="partials/sidebar.html"></div>

    <!-- MAIN CONTENT CANVAS -->
    <main class="main-content">
      <div class="content-inner-container">
        
        <!-- TAB 1: TELEMETRIA CLINICA & ANOMALY DETECTION -->
        <div id="viewSeries">
          
          <!-- Empty State -->
          <div id="emptyStatePlaceholder" class="canvas-empty-state hidden">
            <div class="canvas-empty-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            </div>
            <div class="canvas-empty-title">Seleziona un Caso Clinico dalla Barra Laterale</div>
            <div class="canvas-empty-desc">
              Accedi alle serie temporali biometriche registrate su MongoDB Gold ed esegui i modelli di Anomaly Detection in tempo reale.
            </div>
          </div>

          <!-- ACTIVE WORKBENCH -->
          <div id="workbenchCanvas" style="display: flex; flex-direction: column; gap: 1.25rem;">
            <div data-include="partials/patient-hud.html"></div>
            <div data-include="partials/vitals-grid.html"></div>
            <div data-include="partials/consensus-matrix.html"></div>
            <div data-include="partials/chart-hr-spo2.html"></div>
            <div data-include="partials/chart-nibp.html"></div>
            <div data-include="partials/anomaly-table.html"></div>
          </div>
        </div>

        <!-- TAB 2: GOVERNANCE & BENCHMARKS -->
        <div id="viewLakehouse" class="hidden">
          <div data-include="partials/lakehouse-view.html"></div>
        </div>

      </div>
    </main>
  </div>

  <!-- 3. MODAL (loaded from partial) -->
  <div data-include="partials/modal-explanation.html"></div>

  <!-- SCRIPT ARCHITECTURE -->
  <script src="js/loader.js?v=3.2"></script>
  <script src="js/icons.js?v=3.2"></script>
  <script src="js/api.js?v=3.2"></script>
  <script src="js/store.js?v=3.2"></script>
  <script src="js/charts.js?v=3.2"></script>
  <script src="js/components.js?v=3.2"></script>
  <script src="js/lakehouse.js?v=3.2"></script>
  <script src="js/app.js?v=3.2"></script>
</body>
</html>
